name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Unit, browser, lint, audit, and secret scan
        id: checks
        run: node scripts/ci.mjs
        continue-on-error: true

      - name: Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Write test summary
        id: summary
        run: node scripts/finalize-summary.mjs
        env:
          LHCI_RESULTS: ${{ steps.lighthouse.outputs.resultsPath }}

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: |
            test-summary.json
            coverage/coverage-summary.json
            test-results/
          if-no-files-found: warn
